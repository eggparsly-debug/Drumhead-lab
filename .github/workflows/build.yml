name: Build Windows VST3

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache JUCE download
        uses: actions/cache@v4
        with:
          path: build/_deps
          key: juce-8.0.4-${{ runner.os }}

      - name: Configure
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Engine check against browser render
        run: build/Release/dhrender.exe --selftest

      - name: Upload VST3
        uses: actions/upload-artifact@v4
        with:
          name: DrumheadLab-VST3-Windows
          path: build/DrumheadLab_artefacts/Release/VST3/

      - name: Upload Standalone
        uses: actions/upload-artifact@v4
        with:
          name: DrumheadLab-Standalone-Windows
          path: build/DrumheadLab_artefacts/Release/Standalone/
