name: Build Windows VST3

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache JUCE download
        uses: actions/cache@v4
        with:
          path: build/_deps
          key: juce-8.0.4-${{ runner.os }}

      - name: Install WebView2 SDK (the plugin window is the builder page)
        shell: pwsh
        run: |
          Register-PackageSource -ProviderName NuGet -Name nugetRepository -Location https://www.nuget.org/api/v2 -Force -Trusted
          Install-Package Microsoft.Web.WebView2 -Scope CurrentUser -RequiredVersion 1.0.1901.177 -Source nugetRepository -Force

      - name: Configure
        run: cmake -S . -B build -A x64

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Engine check against browser render
        run: build/Release/dhrender.exe --selftest

      - name: Upload VST3
        uses: actions/upload-artifact@v4
        with:
          name: DrumheadLab-VST3-Windows
          path: build/DrumheadLab_artefacts/Release/VST3/

      - name: Upload Standalone
        uses: actions/upload-artifact@v4
        with:
          name: DrumheadLab-Standalone-Windows
          path: build/DrumheadLab_artefacts/Release/Standalone/
